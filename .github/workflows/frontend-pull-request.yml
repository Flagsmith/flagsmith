name: Frontend Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - frontend/**
      - .github/workflows/frontend-pull-request.yml

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --passWithNoTests

  lint:
    name: Lint and type check changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # reviewdog reports Stylelint results as a check run.
      checks: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # needed to diff against the PR base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lints only the lines this PR changed (eslint-plugin-diff), so the
      # pre-existing backlog doesn't fail PRs. Fork-safe: pure eslint + git.
      - name: Lint changed lines
        env:
          ESLINT_PLUGIN_DIFF_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: npm run lint

      # Fails only on problems in lines this PR added, so existing styles
      # don't fail it.
      - name: Lint changed SCSS lines
        uses: reviewdog/action-stylelint@v1.33.0
        with:
          workdir: frontend
          # Quoted so Stylelint expands the glob, not the action's shell.
          stylelint_input: "'**/*.scss'"
          reporter: github-pr-check
          filter_mode: added
          fail_level: error

      # Fails on type errors that aren't in .tsc-baseline.json, in the folders
      # held at no new errors or in files this PR changed. After fixing errors,
      # run `npm run typecheck:baseline` to shrink the baseline.
      - name: Check for new type errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            git ls-files 'web/components/base/*.ts' 'web/components/base/*.tsx'
            git diff --name-only --relative "$BASE_SHA"...HEAD -- '*.ts' '*.tsx'
          } > "$RUNNER_TEMP/ts-check-files.txt"
          # tsc exits non-zero on type errors; fail only if it exited without reporting any.
          npx tsc --noEmit --incremental false --pretty false > "$RUNNER_TEMP/tsc.txt" || grep -q 'error TS' "$RUNNER_TEMP/tsc.txt"
          npx tsc-baseline check --changedFiles "$RUNNER_TEMP/ts-check-files.txt" < "$RUNNER_TEMP/tsc.txt"

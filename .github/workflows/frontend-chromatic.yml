name: Frontend Chromatic

on:
  # Keep the two path lists below identical. Anything outside them cannot change
  # how a story renders, so a build there only burns snapshot quota. They are
  # duplicated rather than shared via a YAML anchor because GitHub Actions does
  # not support anchors in workflow files.
  #
  # package.json is included because a dependency bump (Storybook, React,
  # Bootstrap) can change rendering, and it is also where TurboSnap bails to a
  # full build, which is exactly when main's baselines need refreshing.
  push:
    branches: [main]
    paths:
      - frontend/web/components/**
      - frontend/web/styles/**
      - frontend/common/theme/**
      - frontend/documentation/**
      - frontend/.storybook/**
      - frontend/package.json
      - .github/workflows/frontend-chromatic.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - frontend/web/components/**
      - frontend/web/styles/**
      - frontend/common/theme/**
      - frontend/documentation/**
      - frontend/.storybook/**
      - frontend/package.json
      - .github/workflows/frontend-chromatic.yml

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    # Fork PRs (incl. Dependabot) can't read CHROMATIC_PROJECT_TOKEN — GitHub
    # withholds repo secrets from pull_request runs originating from forks, so
    # Chromatic would fail with "Missing project token". Skip them here; main's
    # post-merge push runs Chromatic with full secrets, so coverage isn't lost.
    if: |
      github.actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.pull_request.draft == false)
      && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@v16
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Dev-mode build keeps React's act() in the bundle —
          # production strips it and breaks play function synthetic
          # events (Storybook #19758).
          buildScriptName: build-storybook:dev
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          # Snapshot allowlist. We are on the free 5,000-snapshot plan, and the
          # full surface is 217 capturable stories, so one build that cannot use
          # TurboSnap costs 434 snapshots (x2 for the light and dark modes). A
          # single bad day in July burned 2,766. These 17 files are the stories
          # whose dark appearance comes from a hand-written `.dark` override
          # rather than from a token, so they are the only ones a snapshot can
          # catch drifting. Everything else inherits its baseline.
          #
          # Paths are relative to the Storybook project root (workingDir), and
          # are file paths rather than story titles because several titles
          # contain spaces ("Components/Data Display/Chip") and the action does
          # not document how it splits list inputs.
          #
          # Widening this list costs ~62 snapshots/month per story added, at the
          # current ~261 builds/month and 12% TurboSnap bail rate.
          onlyStoryFiles: |
            documentation/SemanticTokens.stories.tsx
            documentation/ColourPalette.stories.tsx
            documentation/RadiusTokens.stories.tsx
            documentation/ElevationTokens.stories.tsx
            documentation/MotionTokens.stories.tsx
            documentation/components/Icons.stories.tsx
            documentation/components/Button.stories.tsx
            documentation/components/Input.stories.tsx
            documentation/components/Switch.stories.tsx
            documentation/components/Chip.stories.tsx
            documentation/components/Tooltip.stories.tsx
            documentation/components/Tabs.stories.tsx
            documentation/components/Card.stories.tsx
            documentation/components/Panel.stories.tsx
            documentation/components/Modal.stories.tsx
            documentation/components/ErrorMessage.stories.tsx
            documentation/components/MultiSelect.stories.tsx
          autoAcceptChanges: main

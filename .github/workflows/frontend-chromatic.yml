name: Frontend Chromatic

on:
  # Keep both path lists identical. Nothing outside them can change how a story
  # renders. Duplicated because GitHub Actions does not support YAML anchors.
  push:
    branches: [main]
    paths:
      - frontend/web/components/**
      - frontend/web/styles/**
      - frontend/common/theme/**
      - frontend/documentation/**
      - frontend/.storybook/**
      - frontend/package.json
      - .github/workflows/frontend-chromatic.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - frontend/web/components/**
      - frontend/web/styles/**
      - frontend/common/theme/**
      - frontend/documentation/**
      - frontend/.storybook/**
      - frontend/package.json
      - .github/workflows/frontend-chromatic.yml

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    # Fork PRs (incl. Dependabot) can't read CHROMATIC_PROJECT_TOKEN — GitHub
    # withholds repo secrets from pull_request runs originating from forks, so
    # Chromatic would fail with "Missing project token". Skip them here; main's
    # post-merge push runs Chromatic with full secrets, so coverage isn't lost.
    if: |
      github.actor != 'dependabot[bot]'
      && (github.event_name == 'push' || github.event.pull_request.draft == false)
      && (github.event_name == 'push'
        || github.event.pull_request.head.repo.full_name == github.repository)

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@v16
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Dev-mode build keeps React's act() in the bundle —
          # production strips it and breaks play function synthetic
          # events (Storybook #19758).
          buildScriptName: build-storybook:dev
          exitZeroOnChanges: true
          exitOnceUploaded: true
          onlyChanged: true
          # On the free plan a build that cannot use TurboSnap costs 434
          # snapshots, so capture only stories whose dark styling is a
          # hand-written `.dark` override rather than a token. Everything else
          # inherits its baseline. Widening this costs ~62 snapshots/month per
          # story. Paths relative to workingDir, not story titles, because some
          # titles contain spaces and the action does not document list parsing.
          onlyStoryFiles: |
            documentation/SemanticTokens.stories.tsx
            documentation/components/Icons.stories.tsx
            documentation/components/Button.stories.tsx
            documentation/components/Input.stories.tsx
            documentation/components/Switch.stories.tsx
            documentation/components/Chip.stories.tsx
            documentation/components/Tooltip.stories.tsx
            documentation/components/Tabs.stories.tsx
            documentation/components/Card.stories.tsx
            documentation/components/Panel.stories.tsx
            documentation/components/Modal.stories.tsx
            documentation/components/ErrorMessage.stories.tsx
            documentation/components/MultiSelect.stories.tsx
          autoAcceptChanges: main

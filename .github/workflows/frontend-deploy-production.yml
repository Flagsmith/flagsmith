name: Frontend Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/**

jobs:
  notify-production-deploy-started:
    name: Notify Production Deploy Started
    # No needs, so this lands within seconds of the push. Knowing a deploy is
    # in flight is only useful while it still is.
    runs-on: ubuntu-latest
    permissions:
      # Enough to resolve the local action below.
      contents: read

    steps:
      - name: Cloning repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing runs git after this, so the token need not persist.
          persist-credentials: false

      - name: Notify Slack
        # A Slack outage must not hold up a deploy.
        continue-on-error: true
        uses: ./.github/actions/notify-slack-deploy
        with:
          webhook_url: ${{ secrets.SLACK_FRONTEND_DEPLOY_WEBHOOK }}
          service: Frontend
          app_url: https://app.flagsmith.com
          state: in_progress
          commit_sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          commit_message: ${{ github.event.head_commit.message }}

  run-unit-tests:
    runs-on: ubuntu-latest
    name: Run Unit Tests

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Cloning repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --passWithNoTests

  run-tests:
    needs: run-unit-tests
    runs-on: depot-ubuntu-latest
    name: Run E2E Tests
    environment: production
    concurrency:
      group: e2e-tests-prod
      cancel-in-progress: true

    steps:
      - name: Cloning repo
        uses: actions/checkout@v5
      
      # Temporarily install Firefox 143.0 to avoid test failures as superior versions cause frontend e2e tests to hang
      # To be removed once upstream issue correctly resolved
      - name: Install Firefox 143.0
        run: |
          sudo apt-get remove -y firefox || true
          sudo rm -rf /usr/bin/firefox /usr/lib/firefox*
          
          ARCH=$(uname -m)
          wget -O /tmp/firefox.tar.xz "https://ftp.mozilla.org/pub/firefox/releases/143.0/linux-${ARCH}/en-US/firefox-143.0.tar.xz"
          sudo tar -xJf /tmp/firefox.tar.xz -C /opt
          sudo ln -s /opt/firefox/firefox /usr/local/bin/firefox
          rm /tmp/firefox.tar.xz
          
          firefox --version

      - name: Run E2E tests against production
        uses: ./.github/actions/e2e-tests
        with:
          e2e_test_token: ${{ secrets.E2E_TEST_TOKEN }}
          slack_token: ${{ secrets.SLACK_TOKEN }}
          environment: prod
          tests: --grep "@oss|@enterprise|@saas"

  deploy-production:
    name: Deploy to Vercel Production
    needs: run-tests
    uses: ./.github/workflows/.reusable-frontend-deploy.yml
    with:
      gh_environment: production
      npm_build_environment: prod
    secrets: inherit

  notify-production-deploy:
    name: Notify Production Deploy
    needs: [run-unit-tests, run-tests, deploy-production]
    # Reports whatever happened, so a failed or superseded run is announced too.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      # Enough to resolve the local action below.
      contents: read
      # Reading this run's start time for the timings in the message.
      actions: read

    steps:
      - name: Cloning repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing runs git after this, so the token need not persist.
          persist-credentials: false

      - name: Resolve what to report
        id: outcome
        env:
          UNIT_TESTS: ${{ needs.run-unit-tests.result }}
          E2E_TESTS: ${{ needs.run-tests.result }}
          DEPLOY: ${{ needs.deploy-production.result }}
          GH_TOKEN: ${{ github.token }}
          RUN_API_PATH: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu

          # Only the production job decides this. deploy-demo and deploy-demo2
          # run alongside it, so the run's own conclusion cannot be used: one
          # failed demo would report production as failed.
          # A supersede reads as cancelled rather than failed, since run-tests
          # cancels itself in progress when the next commit lands on main.
          if [ "$DEPLOY" = success ]; then
            conclusion=success
          elif [ "$UNIT_TESTS" = cancelled ] || [ "$E2E_TESTS" = cancelled ] || [ "$DEPLOY" = cancelled ]; then
            conclusion=cancelled
          else
            conclusion=failure
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

          # Best effort: without it the message loses two fields and stays true.
          started_at="$(gh api "$RUN_API_PATH" --jq '.run_started_at' 2>/dev/null || true)"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        # The run is over by this point, so a Slack outage must not fail it.
        continue-on-error: true
        uses: ./.github/actions/notify-slack-deploy
        with:
          webhook_url: ${{ secrets.SLACK_FRONTEND_DEPLOY_WEBHOOK }}
          service: Frontend
          app_url: https://app.flagsmith.com
          state: ${{ steps.outcome.outputs.conclusion }}
          commit_sha: ${{ github.sha }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          commit_message: ${{ github.event.head_commit.message }}
          started_at: ${{ steps.outcome.outputs.started_at }}
          ended_at: ${{ steps.outcome.outputs.ended_at }}

  deploy-demo:
    name: Deploy to Vercel Demo
    needs: run-tests
    uses: ./.github/workflows/.reusable-frontend-deploy.yml
    with:
      gh_environment: demo
      npm_build_environment: prod
    secrets: inherit

  deploy-demo2:
    name: Deploy to Vercel Demo2
    needs: run-tests
    uses: ./.github/workflows/.reusable-frontend-deploy.yml
    with:
      gh_environment: demo2
      npm_build_environment: prod
    secrets: inherit

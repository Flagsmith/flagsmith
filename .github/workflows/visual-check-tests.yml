name: Visual check tests

on:
  pull_request:
    paths:
      - .github/actions/visual-check/**
      - .github/workflows/visual-check-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Visual check action tests
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/visual-check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node --test .github/actions/visual-check/test/*.test.mjs

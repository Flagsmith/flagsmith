name: Frontend Type Check

# Reports how a pull request changes the number of TypeScript errors.
# Main keeps its own count as an artifact; pull requests compare against it.
# Not a required check: it calls attention to new errors without blocking.

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-typecheck.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - frontend/**
      - .github/workflows/frontend-typecheck.yml

permissions:
  contents: read

# A newer push to a pull request replaces its older report. Main's counts are
# never cancelled, since pull requests compare against them.
concurrency:
  group: frontend-typecheck-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript-errors:
    name: TypeScript errors
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download main's count
      pull-requests: write # post the report

    defaults:
      run:
        working-directory: frontend

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Count errors
        run: node scripts/typecheck-report/index.mjs count "$GITHUB_SHA" typecheck-counts.json

      - name: Keep main's count
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-counts
          path: frontend/typecheck-counts.json
          retention-days: 90

      # Main only runs this when frontend files change, so its latest count
      # usually belongs to an older commit than the base. The next step checks
      # that the frontend is the same in both.
      - name: Download main's latest count
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: frontend-typecheck.yml
          branch: main
          name: typecheck-counts
          path: frontend/base
          if_no_artifact_found: warn

      - name: Check the count matches the base
        if: github.event_name == 'pull_request'
        id: base
        run: |
          if [ ! -f base/typecheck-counts.json ]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count_sha=$(node -p "require('./base/typecheck-counts.json').sha")
          state=current
          if [ "$count_sha" != "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$count_sha" "$BASE_SHA"
            git diff --quiet "$count_sha" "$BASE_SHA" -- . || state=stale
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Compare with main
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          action=$(node scripts/typecheck-report/index.mjs compare base/typecheck-counts.json typecheck-counts.json "${{ steps.base.outputs.state }}" report.md)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Comments when the total moves or any file gains errors. Otherwise it
      # only refreshes an existing comment, so quiet pull requests get none.
      # Fork pull requests can't comment; the job summary still has the report.
      - name: Report on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: typescript-errors
          path: frontend/report.md
          only_update: ${{ steps.compare.outputs.action == 'update' }}

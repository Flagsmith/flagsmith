<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Application and database state across an upgrade, rollback and restore</title>
<desc id="d">Four stages. Before: old app, old schema. After helm upgrade: new app, new schema. After helm rollback: old app, new schema, which is a mismatch. After restore: old app, old schema restored from backup.</desc>
<rect width="760" height="330" rx="8" fill="#ffffff" stroke="#c9d3d6"/>
<g font-size="13" fill="#1c2428" text-anchor="middle">
<rect x="130" y="16" width="140" height="44" rx="4" fill="#0d7a7a"/>
<text x="200" y="35" fill="#ffffff" font-weight="bold">1. Before</text><text x="200" y="52" fill="#ffffff">backup taken here</text>
<rect x="285" y="16" width="140" height="44" rx="4" fill="#0d7a7a"/>
<text x="355" y="35" fill="#ffffff" font-weight="bold">2. helm upgrade</text><text x="355" y="52" fill="#ffffff">migrations run</text>
<rect x="440" y="16" width="140" height="44" rx="4" fill="#0d7a7a"/>
<text x="510" y="35" fill="#ffffff" font-weight="bold">3. helm rollback</text><text x="510" y="52" fill="#ffffff">chart only</text>
<rect x="595" y="16" width="140" height="44" rx="4" fill="#0d7a7a"/>
<text x="665" y="35" fill="#ffffff" font-weight="bold">4. Restore</text><text x="665" y="52" fill="#ffffff">from the backup</text>

<rect x="20" y="82" width="100" height="62" rx="4" fill="#e8f4f4" stroke="#0d7a7a"/>
<text x="70" y="118" font-weight="bold">Application</text>
<rect x="20" y="172" width="100" height="78" rx="4" fill="#e8f4f4" stroke="#0d7a7a"/>
<text x="70" y="216" font-weight="bold">Database</text>

<rect x="130" y="82" width="140" height="62" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="200" y="118">Flagsmith 2.222.0</text>
<rect x="285" y="82" width="140" height="62" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="355" y="118">Flagsmith 2.286.0</text>
<rect x="440" y="82" width="140" height="62" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="510" y="118">Flagsmith 2.222.0</text>
<rect x="595" y="82" width="140" height="62" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="665" y="118">Flagsmith 2.222.0</text>

<rect x="130" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="200" y="216">Old schema</text>
<rect x="285" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="355" y="206">New schema</text><text x="355" y="224">91 migrations</text><text x="355" y="240">applied in the test</text>
<rect x="440" y="172" width="140" height="78" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="510" y="206" fill="#7a1f16" font-weight="bold">New schema</text><text x="510" y="224" fill="#7a1f16">not reverted by Helm</text>
<rect x="595" y="172" width="140" height="78" rx="4" fill="#ffffff" stroke="#0d7a7a" stroke-width="2"/>
<text x="665" y="206">Old schema</text><text x="665" y="224">restored from</text><text x="665" y="240">the backup</text>

<rect x="440" y="268" width="140" height="40" rx="4" fill="#c0392b"/>
<text x="510" y="285" fill="#ffffff" font-weight="bold">Mismatch</text><text x="510" y="301" fill="#ffffff">old app, new schema</text>
<rect x="595" y="268" width="140" height="40" rx="4" fill="#0d7a7a"/>
<text x="665" y="285" fill="#ffffff" font-weight="bold">Works again</text><text x="665" y="301" fill="#ffffff">newer changes lost</text>
</g></svg>

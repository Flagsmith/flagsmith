<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="440" viewBox="0 0 1010 440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#666"/>
    </marker>
  </defs>

  <rect width="1010" height="440" fill="#fff"/>

  <g transform="translate(0 20)">
    <!-- Flagsmith-run group -->
    <rect x="200" y="38" width="500" height="132" rx="6" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
    <text x="214" y="57" font-weight="bold" fill="#555">Event pipeline, run by Flagsmith</text>

    <!-- Boxes: top row -->
    <rect x="20" y="70" width="140" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="90" y="96" text-anchor="middle" font-weight="bold">Your application</text>
    <text x="90" y="114" text-anchor="middle" font-size="11">Flagsmith SDK</text>

    <rect x="220" y="70" width="130" height="60" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="285" y="96" text-anchor="middle" font-weight="bold">Ingestion server</text>
    <text x="285" y="114" text-anchor="middle" font-size="11">validates events</text>

    <rect x="390" y="70" width="100" height="60" rx="4" fill="#fff2cc" stroke="#d6b656"/>
    <text x="440" y="96" text-anchor="middle" font-weight="bold">Kafka</text>
    <text x="440" y="114" text-anchor="middle" font-size="11">buffers events</text>

    <rect x="530" y="70" width="150" height="60" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="605" y="96" text-anchor="middle" font-weight="bold">Warehouse delivery</text>
    <text x="605" y="114" text-anchor="middle" font-size="11">inserts and retries</text>

    <!-- Warehouses -->
    <rect x="760" y="0" width="200" height="56" rx="4" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="860" y="24" text-anchor="middle" font-weight="bold">Managed warehouse</text>
    <text x="860" y="42" text-anchor="middle" font-size="11">Flagsmith-run ClickHouse (default)</text>

    <rect x="760" y="80" width="200" height="56" rx="4" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="860" y="104" text-anchor="middle" font-weight="bold">Your warehouse</text>
    <text x="860" y="122" text-anchor="middle" font-size="11">optional, per environment</text>

    <!-- Boxes: bottom rows -->
    <rect x="380" y="230" width="120" height="60" rx="4" fill="#f5f5f5" stroke="#666"/>
    <text x="440" y="256" text-anchor="middle" font-weight="bold">Postgres</text>
    <text x="440" y="274" text-anchor="middle" font-size="11">Flagsmith database</text>

    <rect x="20" y="330" width="140" height="50" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="90" y="360" text-anchor="middle" font-weight="bold">Dashboard</text>

    <rect x="220" y="330" width="130" height="50" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="285" y="360" text-anchor="middle" font-weight="bold">Core API</text>

    <!-- Event flow -->
    <g stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <path d="M160 100H218"/>
      <path d="M350 100H388"/>
      <path d="M490 100H528"/>
      <path d="M680 108H758"/>
      <path d="M440 70V28H758" stroke-dasharray="6 4"/>
      <path d="M285 130V260H378"/>
      <path d="M605 130V260H502"/>
      <path d="M160 355H218"/>
      <path d="M350 355H860V138"/>
      <path d="M860 355H990V28H962"/>
    </g>

    <!-- Arrow labels -->
    <g font-size="11" fill="#555">
      <text x="180" y="92" text-anchor="middle">events</text>
      <text x="719" y="100" text-anchor="middle">insert</text>
      <text x="600" y="20" text-anchor="middle">reads Kafka directly</text>
      <text x="293" y="200">environment-key</text>
      <text x="293" y="214">lookup</text>
      <text x="613" y="200">warehouse connections,</text>
      <text x="613" y="214">delivery status</text>
      <text x="612" y="347" text-anchor="middle">experiment results queries</text>
    </g>
  </g>
</svg>
